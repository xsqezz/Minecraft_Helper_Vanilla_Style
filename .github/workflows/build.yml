name: Build Fabric mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build remapped mod JAR
        run: gradle remapJar --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: bratansgg-fabric-1.21.11
          path: build/libs/bratansgg-1.0.0.jar
          if-no-files-found: error
